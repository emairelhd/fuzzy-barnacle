<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slideshow</title>
<style>
.slideshow {
  position: relative;
  max-width: 800px;
  margin: auto;
}
.slideshow img {
  width: 100%;
  display: none;
}
</style>
<script>
let slideIndex = 0;
function showSlides() {
  const slides = document.getElementsByClassName('slides');
  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = 'none';
  }
  slideIndex++;
  if (slideIndex > slides.length) {
    slideIndex = 1;
  }
  slides[slideIndex - 1].style.display = 'block';
  setTimeout(showSlides, 3000); // Change slide every 3 seconds
}
window.onload = showSlides;
</script>
</head>
<body>
<div class="slideshow">
  <img class="slides" src="https://picsum.photos/id/237/800/400" alt="Slide 1">
  <img class="slides" src="https://picsum.photos/id/238/800/400" alt="Slide 2">
  <img class="slides" src="https://picsum.photos/id/239/800/400" alt="Slide 3">
</div>
</body>
</html>
